# Staging (预发布, PRD part 2 §5) on one machine: PostgreSQL, the server, nginx with
# the website. Production uses Aliyun RDS instead of the db service.
#   npm run build -w @zhiyouji/web && docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zhiyouji
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: zhiyouji
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  server:
    build: { context: .., dockerfile: Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://zhiyouji:${DB_PASSWORD}@db:5432/zhiyouji
      STORAGE_DIR: /data/storage
    volumes: [storage:/data/storage]
    depends_on: [db]
    restart: unless-stopped
    stop_grace_period: 30s
  nginx:
    image: nginx:1.27
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [server]
    restart: unless-stopped
volumes:
  pgdata:
  storage:

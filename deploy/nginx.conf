# One domain for the website and the API (the website calls /v1 on its own origin;
# the login cookie is SameSite=Lax). The admin console can live on OSS + CDN with
# VITE_API_BASE pointing here.
server {
  listen 443 ssl http2;
  server_name app.example.cn;            # 【待填】备案后的域名
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  client_max_body_size 600m;             # 视频最大 500 MB（apps/server/src/config.ts）

  location /v1/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }

  # the website (apps/web/dist): a single-page app
  root /usr/share/nginx/html;
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}

server {
  listen 80;
  server_name app.example.cn;
  return 301 https://$host$request_uri;
}
